#config-version=FGT100F-7.04-FW-build2662-230503
#buildno=2662
config system global
    set hostname "DEMO-FGT-01"
end
config system interface
    edit "port1"
        set alias "WAN"
        set ip 203.0.113.10 255.255.255.0
    next
    edit "port2"
        set alias "USER-ZONE"
        set ip 10.10.0.1 255.255.0.0
    next
    edit "port3"
        set alias "SERVER-ZONE"
        set ip 10.20.0.1 255.255.0.0
    next
end
config firewall address
    edit "USER_VLAN"
        set subnet 10.10.0.0 255.255.0.0
    next
    edit "WEB_SERVERS"
        set subnet 10.20.10.0 255.255.255.0
    next
    edit "DB_SERVERS"
        set subnet 10.20.20.0 255.255.255.0
    next
    edit "AD_SERVER"
        set subnet 10.20.5.10 255.255.255.255
    next
    edit "BACKUP_HOST"
        set subnet 10.20.30.40 255.255.255.255
    next
    edit "PARTNER_NET"
        set subnet 198.51.100.0 255.255.255.0
    next
end
config firewall address6
    edit "none"
    next
end
config firewall service custom
    edit "HTTPS"
        set tcp-portrange 443
    next
    edit "SSH"
        set tcp-portrange 22
    next
    edit "MSSQL"
        set tcp-portrange 1433
    next
    edit "TELNET"
        set tcp-portrange 23
    next
    edit "FTP"
        set tcp-portrange 21
    next
end
config firewall policy
    edit 1
        set name "ANY-ANY-ALL-permit"
        set srcintf "port2"
        set dstintf "port3"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set status enable
    next
    edit 2
        set name "OLD-migration-temp-2019"
        set srcintf "port2"
        set dstintf "port3"
        set srcaddr "USER_VLAN"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set status enable
    next
    edit 3
        set name "LEGACY-telnet-mgmt"
        set srcintf "port2"
        set dstintf "port3"
        set srcaddr "USER_VLAN"
        set dstaddr "WEB_SERVERS"
        set action accept
        set schedule "always"
        set service "TELNET"
        set status enable
    next
    edit 4
        set name "DISABLED-old-partner-rule"
        set srcintf "port1"
        set dstintf "port3"
        set srcaddr "PARTNER_NET"
        set dstaddr "DB_SERVERS"
        set action accept
        set schedule "always"
        set service "MSSQL"
        set status disable
    next
    edit 5
        set name "BLOCK-inbound-default-deny"
        set srcintf "port1"
        set dstintf "port3"
        set srcaddr "all"
        set dstaddr "all"
        set action deny
        set schedule "always"
        set service "ALL"
        set status enable
    next
    edit 6
        set name "251015_RITM0044821_user-to-web"
        set srcintf "port2"
        set dstintf "port3"
        set srcaddr "USER_VLAN"
        set dstaddr "WEB_SERVERS"
        set action accept
        set schedule "always"
        set service "HTTPS"
        set status enable
    next
    edit 7
        set name "user-to-db-mixed-svc"
        set srcintf "port2"
        set dstintf "port3"
        set srcaddr "USER_VLAN"
        set dstaddr "DB_SERVERS"
        set action accept
        set schedule "always"
        set service "MSSQL" "FTP"
        set status enable
    next
    edit 8
        set name "server-to-server-any"
        set srcintf "port3"
        set dstintf "port3"
        set srcaddr "WEB_SERVERS"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set status enable
    next
    edit 9
        set name "user-auth-to-ad"
        set srcintf "port2"
        set dstintf "port3"
        set srcaddr "USER_VLAN"
        set dstaddr "AD_SERVER"
        set action accept
        set schedule "always"
        set service "LDAP" "DNS"
        set status enable
    next
    edit 10
        set name "web-to-db-mssql"
        set srcintf "port3"
        set dstintf "port3"
        set srcaddr "WEB_SERVERS"
        set dstaddr "DB_SERVERS"
        set action accept
        set schedule "always"
        set service "MSSQL"
        set status enable
    next
    edit 11
        set name "backup-window-nightly"
        set srcintf "port3"
        set dstintf "port3"
        set srcaddr "BACKUP_HOST"
        set dstaddr "DB_SERVERS"
        set action accept
        set schedule "always"
        set service "SSH"
        set status enable
    next
    edit 12
        set name "temp-test-anyany"
        set srcintf "port2"
        set dstintf "port3"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set status enable
    next
end
config firewall proxy-policy
    edit 1
        set name "PROXY-explicit-any"
        set proxy explicit-web
        set srcintf "port2"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "webproxy"
        set status enable
    next
    edit 2
        set name "PROXY-user-web-https"
        set proxy explicit-web
        set srcintf "port2"
        set srcaddr "USER_VLAN"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "webproxy"
        set status enable
    next
end
config vpn ssl settings
    set servercert "self-sign"
    set tunnel-ip-pools "SSLVPN_POOL"
end
config vpn ssl web portal
    edit "full-access"
        set tunnel-mode enable
    next
end
config vpn ipsec phase1-interface
    edit "toBranch"
        set interface "port1"
        set remote-gw 203.0.113.200
    next
end
config system ha
    set group-name "DEMO-HA"
    set mode a-p
end
